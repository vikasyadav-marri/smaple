<!DOCTYPE html>
<html>
  <head>
    <title>REGISTRATION FORM</title>
    <style>
      body{
        background:#f0f0f0;
      }
      .container{
        background:black;
        padding:20px;
        border-radius:5px;
        width:300px;
        margin:50px auto;
      
      }
      h2{
        text-align:center;
      }
      input,select,button{
        width:100%;
        margin:10px 0;
        padding:10px;
        box-sizing:border-box;
        
      }
      button{
        color:white;
        background:blue;
        border-radius:5px;
        cursor:pointer;
      }
      </style>
      </head>
      <body>
        
        <div class ="container">
          <h2>REGISTRATION FORM</h2>
          <form>
            <input type="text" placeholder= "enter your name" required>
            <input type="email" placeholder="enter your email" required>
          <input type ="tel" placeholder = "enter the phone number" required>
          <select>
            <option>select an event</option>
            <option>hackathon</option>
            <option>exam</option>
            <option>quiz</option>
          </select>
          <button type="submit">Register</button>
          </form>
          </div>
          </body>
</html>
